<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A2C1A"/>
      <stop offset="1" stop-color="#C05621"/>
    </linearGradient>
  </defs>
  <!-- whole canvas transparent; only the top 500px band holds the feature graphic -->
  <rect x="0" y="0" width="1024" height="500" fill="url(#brand)"/>

  <!-- Coffee-cup mark (cream), left side, within the 0..500 band -->
  <g transform="translate(150,180) scale(2.4)">
    <path fill="#F7F1E8" d="M35,52 h34 v11 a13,13 0 0 1 -13,13 h-8 a13,13 0 0 1 -13,-13 z"/>
    <path stroke="#F7F1E8" stroke-width="5" stroke-linecap="round" fill="none" d="M69,55 a8,8 0 0 1 0,16"/>
    <path fill="#F7F1E8" d="M33,80 h38 a2.5,2.5 0 0 1 0,5 h-38 a2.5,2.5 0 0 1 0,-5 z"/>
    <path stroke="#F7F1E8" stroke-width="4" stroke-linecap="round" fill="none" d="M46,47 q5,-5 0,-10 q-5,-5 0,-10 M60,47 q5,-5 0,-10 q-5,-5 0,-10"/>
  </g>

  <text x="440" y="215" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="#F7F1E8" letter-spacing="-2">Kopitiam</text>
  <text x="442" y="283" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#F7F1E8" opacity="0.92">Every PDF tool, free.</text>
